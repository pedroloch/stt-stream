# Configuração do Cliente Whisper Stream
# Cliente simples que consome o servidor Python

# Servidor Python (pode estar em outra máquina)
server:
  # URL do WebSocket (ajuste se servidor estiver remoto)
  url: "ws://localhost:9090/ws"

  # Health check endpoint
  health_url: "http://localhost:9090/health"

# Configurações de Áudio (captura local via sox)
audio:
  # Taxa de amostragem (deve corresponder ao servidor)
  sample_rate: 16000

  # Canais de áudio (1 = mono)
  channels: 1

# Configurações de Display (Terminal)
display:
  # Mostrar transcrições parciais (enquanto processa)
  show_partial: true

  # Mostrar timestamps
  show_timestamps: true

  # Cores do terminal
  colors:
    partial: "cyan"      # Transcrições em progresso
    final: "green"       # Transcrições finais
    error: "red"         # Mensagens de erro
    info: "yellow"       # Mensagens informativas
