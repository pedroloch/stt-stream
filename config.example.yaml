# Configuração do Cliente Whisper Stream
# Cliente simples que consome o servidor Python
#
# IMPORTANTE: O cliente é agnóstico ao hardware!
# Ele apenas se conecta ao servidor Python que pode estar:
# - Local (localhost)
# - VPS com GPU
# - RunPod / Vast.ai / Lambda Labs
# - Qualquer servidor remoto

# Servidor Python (pode estar em outra máquina)
server:
  # ====== LOCALHOST (desenvolvimento local) ======
  url: "ws://localhost:9090/ws"
  health_url: "http://localhost:9090/health"

  # ====== RUNPOD (servidor remoto com GPU) ======
  # Substitua SEU-POD-IP pelo IP do seu pod RunPod
  # url: "ws://SEU-POD-IP:9090/ws"
  # health_url: "http://SEU-POD-IP:9090/health"

  # Exemplo com IP real:
  # url: "ws://167.99.123.456:9090/ws"
  # health_url: "http://167.99.123.456:9090/health"

  # ====== DOMÍNIO CUSTOMIZADO (produção) ======
  # Se configurou domínio com SSL:
  # url: "wss://whisper.seu-dominio.com/ws"
  # health_url: "https://whisper.seu-dominio.com/health"

# Configurações de Áudio (captura local via sox)
audio:
  # Taxa de amostragem (deve corresponder ao servidor)
  sample_rate: 16000

  # Canais de áudio (1 = mono)
  channels: 1

# Configurações de Display (Terminal)
display:
  # Mostrar transcrições parciais (enquanto processa)
  show_partial: false

  # Mostrar timestamps
  show_timestamps: true

  # Cores do terminal
  colors:
    partial: "cyan"      # Transcrições em progresso
    final: "green"       # Transcrições finais
    error: "red"         # Mensagens de erro
    info: "yellow"       # Mensagens informativas
