# Configuração RunPod - Otimizado para GPU com Melhor Qualidade
# Usa modelo large-v3 para máxima precisão de transcrição
#
# IMPORTANTE: Este arquivo é usado automaticamente no Dockerfile.runpod
# Configurações otimizadas para RTX 4090 / A100 com 24GB+ VRAM

# Configurações do Servidor WebSocket
server:
  # Aceitar conexões de qualquer origem (pod está na nuvem)
  host: "0.0.0.0"

  # Porta padrão (RunPod vai expor externamente)
  port: 9090

  # Conexões simultâneas (pode aumentar se tiver muitos clientes)
  max_clients: 10

  # Timeout generoso para streaming de áudio
  idle_timeout: 600  # 10 minutos

  # CORS habilitado para aceitar clientes de qualquer domínio
  cors_enabled: true
  allowed_origins: ["*"]

# Configurações do Whisper - OTIMIZADO PARA QUALIDADE
whisper:
  # Modelo large-v3 - Melhor modelo disponível
  # 3 billion parameters, melhor acurácia em múltiplos idiomas
  model: "large-v3"

  # Idioma: "pt" para português ou "auto" para detecção automática
  # "auto" recomendado se você vai usar múltiplos idiomas
  language: "pt"

  # Backend CUDA (GPU NVIDIA)
  backend: "cuda"

  # Device automático (usa a primeira GPU disponível)
  device: "auto"

  # float16 para melhor qualidade (RTX 4090+ suporta bem)
  compute_type: "float16"

  # VAD (Voice Activity Detection) - Melhora eficiência
  use_vad: true
  vad_threshold: 0.5

  # Chunk size menor para melhor latência de streaming
  min_chunk_size: 1.0

  # Buffer trimming por segmentos de fala
  buffer_trimming: "segment"

  # Beam size = 5 para MÁXIMA QUALIDADE
  # (Padrão é 1, aumentar para 5 melhora precisão mas usa mais GPU)
  beam_size: 5

  # best_of = 5 para considerar mais candidatos
  # (Aumenta qualidade, especialmente para áudio difícil)
  best_of: 5

  # Temperature = 0.0 (determinístico, mais consistente)
  temperature: 0.0

  # Usar contexto de texto anterior (melhora coerência)
  condition_on_previous_text: true

# Performance - Otimizado para GPU de alta performance
performance:
  # Threads automático (deixa CUDA gerenciar)
  threads: "auto"

  # Batch size pode ser maior em GPU potente
  # Teste com 2-4 se tiver múltiplos clientes simultâneos
  batch_size: 1

  # Preferir GPU (sempre true no RunPod)
  prefer_gpu: true

# Paths - Volume persistente no RunPod
paths:
  # Modelos salvos em /app/models (volume persistente)
  models_dir: "/app/models"

  # Cache em /app/cache
  cache_dir: "/app/cache"

# Logging - Importante para debug remoto
logging:
  # Info level (não debug para não logar demais)
  level: "info"

  # Salvar logs em arquivo
  save_to_file: true
  log_dir: "/app/logs"

  # Formato pretty (mais legível)
  format: "pretty"

  # Log stats de áudio (desativado para performance)
  log_audio_stats: false

# Hardware - Forçar CUDA
hardware:
  auto_detect: true

  # Força CUDA (não vai usar CPU por engano)
  force_type: "cuda"

# Security - Básica (adicione auth se necessário)
security:
  # Auth desativado por padrão (adicione se expor publicamente)
  require_auth: false
  api_key: null

  # Rate limiting pode ser útil para evitar abuse
  rate_limit_enabled: true
  max_requests_per_minute: 120  # Generoso para uso legítimo

# Debug - Modo produção
debug:
  # Verbose desativado (ativa via CLI se precisar debug)
  verbose: false

  # Não salvar áudio em produção (uso de disco)
  save_received_audio: false

  # Profiling desativado
  profile: false

  # Mostrar info de hardware ao iniciar (útil para confirmar GPU)
  show_hardware_info: true
