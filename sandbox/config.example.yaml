# Configuração do Cliente Whisper Stream
# Cliente simples que consome o servidor Python
#
# IMPORTANTE: O cliente é agnóstico ao hardware!
# Ele apenas se conecta ao servidor Python que pode estar:
# - Local (localhost)
# - VPS com GPU
# - RunPod / Vast.ai / Lambda Labs
# - Qualquer servidor remoto

# Servidor Python (pode estar em outra máquina)
server:
  # ====== RUNPOD (recomendado para GPU remota) ======
  # Se definir runpod_id, as URLs abaixo são IGNORADAS
  # Exemplos:
  # runpod_id: "41f82dhadte331"
  # runpod_id: "abc123xyz789"
  # Gera automaticamente:
  #   url: wss://41f82dhadte331-9090.proxy.runpod.net/ws
  #   health_url: https://41f82dhadte331-9090.proxy.runpod.net/health
  # runpod_id: ""

  # ====== LOCALHOST (desenvolvimento local) ======
  # Usado se runpod_id não estiver definido ou for vazio
  url: "ws://localhost:9090/ws"
  health_url: "http://localhost:9090/health"

  # ====== ALTERNATIVAS (IP fixo ou domínio customizado) ======
  # Se não usar runpod_id, pode usar IP fixo:
  # url: "ws://167.99.123.456:9090/ws"
  # health_url: "http://167.99.123.456:9090/health"
  #
  # Ou domínio customizado com SSL:
  # url: "wss://whisper.seu-dominio.com/ws"
  # health_url: "https://whisper.seu-dominio.com/health"

# Configurações de Áudio (captura local via sox)
audio:
  # Taxa de amostragem (deve corresponder ao servidor)
  sample_rate: 16000

  # Canais de áudio (1 = mono)
  channels: 1

# Configurações de Display (Terminal)
display:
  # Modo de visualização de transcrições parciais
  # "inline"  - Mostra parcial inline (atualiza mesma linha, discreto)
  # "minimal" - Não mostra parcial, apenas final
  # "full"    - Mostra parcial com quebras de linha (verbose)
  partial_mode: "inline"

  # Mostrar timestamps
  show_timestamps: true

  # Número máximo de mensagens no histórico
  max_history: 50

  # Largura para word wrap (quebra de linha automática)
  word_wrap_width: 80

  # Cores do terminal
  colors:
    partial: "cyan"      # Transcrições em progresso
    final: "green"       # Transcrições finais
    error: "red"         # Mensagens de erro
    info: "yellow"       # Mensagens informativas
    debug: "gray"        # Mensagens de debug
    header: "cyan"       # Header do cliente

# Configurações de Debug (Opcional)
debug:
  # Ativar modo debug (também pode usar DEBUG=1 bun start)
  enabled: false

  # Mostrar JSON completo das mensagens WebSocket
  show_json: true

  # Mostrar estatísticas de áudio
  show_audio_stats: false
