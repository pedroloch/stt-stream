[tool.poetry]
name = "whisper-stream-server"
version = "1.0.0"
description = "Servidor WebSocket independente para transcrição Whisper com suporte a MLX, CUDA e CPU"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "server"}]

[tool.poetry.dependencies]
python = "^3.11"  # Python 3.11+ (3.12 compatível)
aiohttp = "^3.11.0"  # Latest stable
aiohttp-cors = "^0.7.0"
numpy = "^1.24.0,<2.0.0"  # numpy 1.x (compatível com NeMo toolkit)
pyyaml = "^6.0.2"

# Whisper streaming - usar faster-whisper como base
faster-whisper = "^1.2.0"  # Latest stable

# Backends opcionais
mlx-whisper = {version = "^0.4.0", optional = true, markers = "sys_platform == 'darwin' and platform_machine == 'arm64'"}
torch = {version = "^2.6.0", optional = true}  # Latest stable
torchaudio = {version = "^2.6.0", optional = true}  # VAD (Silero)

# cuDNN para faster-whisper com CUDA (Linux GPU)
nvidia-cudnn-cu12 = {version = "^9.1.0", optional = true, markers = "sys_platform == 'linux'"}  # cuDNN for CUDA 12.x

# NOTA: WhisperX removido devido a conflito de numpy
# WhisperX requer numpy>=2.0, mas NeMo requer numpy<2.0
# Para instalar WhisperX: poetry run pip install git+https://github.com/m-bain/whisperx.git
# ATENÇÃO: WhisperX e nemo-toolkit são mutuamente exclusivos!

# Diarization (speaker identification) - opcionais
nemo-toolkit = {version = "^2.2.0", optional = true, extras = ["asr"]}  # Sortformer backend
pyannote-audio = {version = "^3.3.0", optional = true}  # Pyannote backend

[tool.poetry.extras]
mlx = ["mlx-whisper"]
cuda = ["torch", "torchaudio", "nvidia-cudnn-cu12"]
vad = ["torch", "torchaudio"]
diarization-sortformer = ["torch", "torchaudio", "nvidia-cudnn-cu12", "nemo-toolkit"]
diarization-pyannote = ["torch", "torchaudio", "nvidia-cudnn-cu12", "pyannote-audio"]
diarization-all = ["torch", "torchaudio", "nvidia-cudnn-cu12", "nemo-toolkit", "pyannote-audio"]
all = ["torch", "torchaudio", "nvidia-cudnn-cu12", "nemo-toolkit", "pyannote-audio"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"  # Latest stable
pytest-asyncio = "^0.24.0"  # Latest
pytest-cov = "^6.0.0"  # Latest
black = "^24.10.0"  # Latest
ruff = "^0.9.0"  # Latest (huge improvements!)
pyright = "^1.1.389"  # Type checking (faster than mypy)
httpx = "^0.28.0"  # Latest

[tool.poetry.scripts]
whisper-server = "server.main:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ============================================
# Ruff Configuration (Modern Python Linter)
# ============================================
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    "models/",  # Downloaded whisper models
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in argument defaults
    "N805",  # first argument should be self/cls
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports OK in __init__
"tests/**/*.py" = ["S101"]  # Assert OK in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ============================================
# Pyright Configuration (Type Checking)
# ============================================
[tool.pyright]
include = ["server"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/models",  # Downloaded whisper models
]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "standard"  # off | basic | standard | strict

# Report settings
reportMissingImports = false  # Allow optional imports (torch, mlx_whisper, crisper, etc)
reportMissingTypeStubs = false  # Don't require type stubs for all packages
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportDuplicateImport = "warning"
reportOptionalMemberAccess = "none"  # Allow accessing attributes on Optional values
reportOptionalSubscript = "none"    # Allow subscripting Optional values
reportAttributeAccessIssue = "warning"  # Relaxed for initialization patterns
reportPrivateImportUsage = false

# ============================================
# Pytest Configuration
# ============================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# ============================================
# Coverage Configuration
# ============================================
[tool.coverage.run]
source = ["server"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
