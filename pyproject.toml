[tool.poetry]
name = "whisper-stream-server"
version = "1.0.0"
description = "Servidor WebSocket independente para transcrição Whisper com suporte a MLX, CUDA e CPU"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "server"}]

[tool.poetry.dependencies]
python = "^3.10"
aiohttp = "^3.9.0"
aiohttp-cors = "^0.7.0"
numpy = "^1.26.0"
pyyaml = "^6.0"

# Whisper streaming - usar faster-whisper como base
faster-whisper = "^1.0.0"

# Backends opcionais
mlx-whisper = {version = "^0.3.0", optional = true, markers = "sys_platform == 'darwin' and platform_machine == 'arm64'"}
torch = {version = "^2.0.0", optional = true}

[tool.poetry.extras]
mlx = ["mlx-whisper"]
cuda = ["torch"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
black = "^24.0.0"
ruff = "^0.1.9"
httpx = "^0.26.0"  # Para testar HTTP endpoints

[tool.poetry.scripts]
whisper-server = "server.main:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
